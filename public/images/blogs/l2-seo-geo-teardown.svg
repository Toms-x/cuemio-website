<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#F5F6F2"/>

  <!-- faint grid -->
  <g stroke="#DEE2DC" stroke-width="1">
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="440" x2="1200" y2="440"/>
    <line x1="280" y1="0" x2="280" y2="630"/>
  </g>

  <!-- header labels -->
  <text x="80" y="56" font-family="IBM Plex Mono, monospace" font-size="14" letter-spacing="1.5" fill="#8A9088">CUEMIO / TEARDOWN</text>
  <text x="80" y="86" font-family="Instrument Sans, sans-serif" font-size="26" font-weight="600" fill="#12151A">L2 Visibility &#8212; Google vs AI-Grounded Search</text>

  <text x="1120" y="56" text-anchor="end" font-family="IBM Plex Mono, monospace" font-size="14" letter-spacing="1.5" fill="#12151A" font-weight="600">12 KEYWORDS TESTED</text>
  <text x="1120" y="76" text-anchor="end" font-family="IBM Plex Mono, monospace" font-size="12" letter-spacing="1" fill="#8A9088">SOURCE: SERPER.DEV + OPENROUTER (GROUNDED)</text>

  <!-- Bar 1: Google organic top 10 -->
  <text x="80" y="220" font-family="IBM Plex Mono, monospace" font-size="13" letter-spacing="1" fill="#565C63">GOOGLE ORGANIC TOP 10</text>
  <rect x="80" y="236" width="1040" height="34" rx="6" fill="#FFFFFF" stroke="#DEE2DC"/>
  <rect x="80" y="236" width="87" height="34" rx="6" fill="#C6790A"/>
  <text x="80" y="296" font-family="Instrument Sans, sans-serif" font-size="30" font-weight="600" fill="#12151A">1 / 12</text>
  <text x="200" y="296" font-family="IBM Plex Mono, monospace" font-size="13" fill="#8A9088">keywords with an L2's own domain present</text>

  <!-- Bar 2: AI-grounded answers -->
  <text x="80" y="380" font-family="IBM Plex Mono, monospace" font-size="13" letter-spacing="1" fill="#565C63">AI-GROUNDED ANSWERS</text>
  <rect x="80" y="396" width="1040" height="34" rx="6" fill="#FFFFFF" stroke="#DEE2DC"/>
  <rect x="80" y="396" width="953" height="34" rx="6" fill="#1C7C4C"/>
  <text x="80" y="456" font-family="Instrument Sans, sans-serif" font-size="30" font-weight="600" fill="#12151A">11 / 12</text>
  <text x="200" y="456" font-family="IBM Plex Mono, monospace" font-size="13" fill="#8A9088">keywords where an L2 is named &#8212; sourcing still mostly third-party</text>

  <!-- zero-presence callout -->
  <circle cx="80" cy="520" r="5" fill="#12151A"/>
  <text x="98" y="525" font-family="IBM Plex Mono, monospace" font-size="13" letter-spacing="0.5" fill="#12151A" font-weight="600">ZERO PRESENCE, BOTH CHANNELS:</text>
  <text x="98" y="547" font-family="IBM Plex Mono, monospace" font-size="13" letter-spacing="0.5" fill="#565C63">&#8220;L2 bridge security risks&#8221; &#8212; the single clearest content gap</text>

</svg>

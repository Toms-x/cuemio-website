<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg">
  <rect width="640" height="360" fill="#F5F6F2"/>

  <!-- faint grid -->
  <g stroke="#DEE2DC" stroke-width="1">
    <line x1="0" y1="80" x2="640" y2="80"/>
    <line x1="0" y1="160" x2="640" y2="160"/>
    <line x1="0" y1="240" x2="640" y2="240"/>
    <line x1="160" y1="0" x2="160" y2="360"/>
    <line x1="320" y1="0" x2="320" y2="360"/>
    <line x1="480" y1="0" x2="480" y2="360"/>
  </g>

  <!-- area fill under the line -->
  <path
    d="M 40 260 L 130 230 L 220 245 L 310 175 L 400 195 L 490 120 L 580 95 L 600 90 L 600 320 L 40 320 Z"
    fill="#3A36E0"
    fill-opacity="0.08"
  />

  <!-- the line itself -->
  <path
    d="M 40 260 L 130 230 L 220 245 L 310 175 L 400 195 L 490 120 L 580 95 L 600 90"
    fill="none"
    stroke="#3A36E0"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- data-point cue lights -->
  <g>
    <circle cx="40" cy="260" r="4" fill="#565C63"/>
    <circle cx="130" cy="230" r="4" fill="#565C63"/>
    <circle cx="220" cy="245" r="4" fill="#565C63"/>
    <circle cx="310" cy="175" r="4" fill="#565C63"/>
    <circle cx="400" cy="195" r="4" fill="#565C63"/>
    <circle cx="490" cy="120" r="4" fill="#565C63"/>
    <circle cx="580" cy="95" r="6" fill="#1C7C4C"/>
    <circle cx="580" cy="95" r="10" fill="none" stroke="#E4F3EA" stroke-width="4"/>
  </g>

  <!-- monospace-style labels -->
  <text x="40" y="40" font-family="IBM Plex Mono, monospace" font-size="12" letter-spacing="1.5" fill="#8A9088">NET WORTH</text>
  <text x="580" y="40" text-anchor="end" font-family="IBM Plex Mono, monospace" font-size="12" letter-spacing="1.5" fill="#12151A" font-weight="600">+ CASH FLOW</text>
</svg>
